app:
  origin: http://localhost:3008
  allow-insecure-local: true
spring.security.oauth2.client:
  registration.keycloak:
    client-secret: local-only-client-secret
    redirect-uri: http://localhost:8088/login/oauth2/code/keycloak
  provider.keycloak.issuer-uri: http://localhost:8188/realms/saffron
server.servlet.session.cookie.secure: false

payments:
  mode: ${PAYMENT_MODE:local}
  local-base: ${LOCAL_PAYMENT_BASE:http://localhost:8508}
  secret-key: ${LOCAL_PAYMENT_API_KEY:sk_test_saffron_local_fixture_only}
  webhook-secrets: ${LOCAL_PAYMENT_WEBHOOK_SECRET:whsec_saffron_local_webhook_fixture_only_32bytes}

channels:
  email-mode: ${EMAIL_MODE:local}
  sms-mode: ${SMS_MODE:local}
  push-mode: ${PUSH_MODE:local}
  local-key: ${LOCAL_CHANNEL_API_KEY:saffron_local_channel_api_fixture_32bytes}
