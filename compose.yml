name: saffron
services:
  notification-simulator:
    image: python:3.12-alpine
    command: ["python", "/simulator/server.py"]
    ports: ["127.0.0.1:8608:8608"]
    environment:
      API_KEY: ${LOCAL_CHANNEL_API_KEY:-saffron_local_channel_api_fixture_32bytes}
      CONTROL_TOKEN: ${LOCAL_CHANNEL_CONTROL_TOKEN:-saffron_local_channel_control_fixture_32bytes}
    volumes: ["./notification-simulator:/simulator:ro", "channel-provider:/data"]
  payment-sandbox:
    image: python:3.12-alpine
    command: ["python", "/sandbox/server.py"]
    ports: ["127.0.0.1:8508:8508"]
    environment:
      API_KEY: ${LOCAL_PAYMENT_API_KEY:-sk_test_saffron_local_fixture_only}
      WEBHOOK_SECRET: ${LOCAL_PAYMENT_WEBHOOK_SECRET:-whsec_saffron_local_webhook_fixture_only_32bytes}
      CONTROL_TOKEN: ${LOCAL_PAYMENT_CONTROL_TOKEN:-saffron_local_operator_control_fixture}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./payment-sandbox:/sandbox:ro", "payment-provider:/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8188:8080"]
    volumes: ["./infrastructure/keycloak:/opt/keycloak/data/import:ro"]
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: saffron
      POSTGRES_USER: saffron
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:5544:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saffron"]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: ["kafka:/tmp/kraft-combined-logs"]
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9208:9200"]
    volumes: ["search:/usr/share/opensearch/data"]
volumes:
  channel-provider:
  payment-provider:
  pg:
  kafka:
  search:
